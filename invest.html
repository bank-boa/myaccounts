<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Invest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.invest-total h3{ margin:0 0 4px; font-size:14px; color:var(--gray); font-weight:600; }
.invest-total .net-amount{ margin:6px 0 4px; }
.invest-total .sub{ font-size:13px; color:var(--gray); }
.summary-calculations{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
.summary-tile{ background:var(--bg); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:4px; }
.summary-title{ font-size:12px; color:var(--gray); font-weight:600; }
.summary-value{ font-size:17px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
.section-label{ display:flex; justify-content:space-between; align-items:baseline; margin:4px 2px 10px; font-size:13px; font-weight:600; color:var(--gray); }
.section-label strong{ font-size:16px; color:var(--ink); font-weight:800; }
.pos-card{ background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:12px; }
.pos-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.pos-name{ font-size:15.5px; font-weight:700; line-height:1.3; color:var(--ink); }
.pos-sub{ font-size:12.5px; color:var(--gray); font-weight:600; margin-top:3px; }
.pos-value{ font-size:19px; font-weight:800; white-space:nowrap; text-align:right; font-variant-numeric:tabular-nums; }
.pos-chip{ display:inline-block; margin-top:6px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; background:#E8EEF7; color:var(--blue); }
.pos-chip.matured{ background:#FBE9EC; color:var(--red); }
.pos-chip.new{ background:#E3F3EE; color:#1C7C63; }
.pos-note{ margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--bg); font-size:12.5px; color:var(--gray); line-height:1.4; }
.pos-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.pos-grid .k{ display:block; font-size:12px; color:var(--gray); font-weight:600; }
.pos-grid .v{ display:block; font-size:14.5px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
.pos-grid .v.credit{ color:#1C7C63; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <a class="menu-btn" href="menu.html" aria-label="Menu">
      <div class="bars"><span></span><span></span><span></span></div>
      Menu
    </a>
    <div class="icon-row">
      <a class="icon-btn" href="inbox.html" aria-label="Inbox">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2D5C" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6l9 7 9-7"/></svg>
        Inbox
      </a>
      <a class="icon-btn" href="products.html" aria-label="Products">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2D5C" stroke-width="1.7"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 4h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>
        Products
      </a>
      <a class="icon-btn" href="logout.html" aria-label="Log out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2D5C" stroke-width="1.7"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log out
      </a>
    </div>
  </div>

  <div class="page-header">
    <a class="back-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      Accounts
    </a>
    <h1>Invest</h1>
    <p>Bond &amp; CD Positions</p>
  </div>

  <div class="content">
    <div class="dash-card invest-total reveal">
      <h3>BOND &amp; CD POSITIONS</h3>
      <div class="net-amount" id="sum-value">$0.00</div>
      <div class="sub">Current value</div>
      <div class="summary-calculations">
        <div class="summary-tile"><span class="summary-title">Total par value</span><span class="summary-value" id="sum-par">0.00</span></div>
        <div class="summary-tile"><span class="summary-title">Next 12 months interest</span><span class="summary-value" id="sum-interest">$0.00</span></div>
        <div class="summary-tile" style="grid-column:1/-1;"><span class="summary-title">Average duration (years)</span><span class="summary-value" id="sum-duration">0.000</span></div>
      </div>
    </div>

    <div class="section-label reveal"><strong>Positions</strong><span><span id="sum-count">0</span> &middot; by maturity</span></div>
    <div id="positions-list"></div>
  </div>

  <div class="bottom-nav">
    <a class="nav-item" href="index.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6066" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1 1-1.8 3-1.8s3 .8 3 1.8-1 1.4-3 1.8-3 .9-3 1.9 1 1.8 3 1.8 3-.8 3-1.8"/></svg>
      Accounts
    </a>
    <a class="nav-item" href="pay-transfer.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6066" stroke-width="1.8"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
      Pay &amp; Transfer
    </a>
    <a class="nav-item" href="deposit-checks.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6066" stroke-width="1.8"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
      Deposit Checks
    </a>
    <a class="nav-item active" href="invest.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2D5C" stroke-width="1.8"><path d="M12 2v10l8 4"/><circle cx="12" cy="12" r="9"/></svg>
      Invest
    </a>
  </div>

</div>
<script>
(function () {
  const MS_PER_DAY = 24 * 60 * 60 * 1000;

  const POSITIONS = [
      {description: "MORGAN STANLEY BK N 4.10000% 10/02/2026", account: "Individual - Z07950813", tag: "HYPO", cusip: "61690DZ50", assetClass: "CD", quantity: 500, coupon: 4.100, maturity: "10/02/2026", callStatus: "Call Protected", currentValue: 500},
      {description: "MORGAN STANLEY 4.05000% 10/30/2026", account: "Individual - Z07950813", tag: "HYPO", cusip: "61776NRG0", assetClass: "CD", quantity: 20000, coupon: 4.050, maturity: "10/30/2026", callStatus: "Call Protected", currentValue: 20000},
      {description: "GOLDMAN SACHS BK USA 4.00000% 12/31/2026", account: "Individual - Z07950813", tag: "HYPO", cusip: "38150VG37", assetClass: "CD", quantity: 63000, coupon: 4.000, maturity: "12/31/2026", callStatus: "Call Protected", currentValue: 63000},
      {description: "GOLDMAN SACHS BK USA 4.00000% 07/08/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "38150V3D9", assetClass: "CD", quantity: 5192, coupon: 4.000, maturity: "07/08/2027", callStatus: "Call Protected", currentValue: 5192},
      {description: "GOLDMAN SACHS BK USA 4.00000% 08/12/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "38150V4M8", assetClass: "CD", quantity: 1839, coupon: 4.000, maturity: "08/12/2027", callStatus: "Call Protected", currentValue: 1839},
      {description: "GOLDMAN SACHS BK USA 4.00000% 08/12/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "38150V4M8", assetClass: "CD", quantity: 541, coupon: 4.000, maturity: "08/12/2027", callStatus: "Call Protected", currentValue: 541},
      {description: "CAPITAL ONE NATL 4.30000% 09/30/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "14042RUR0", assetClass: "CD", quantity: 6000, coupon: 4.300, maturity: "09/30/2027", callStatus: "Call Protected", currentValue: 6000},
      {description: "CAPITAL ONE NATL 4.30000% 09/30/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "14042RUR0", assetClass: "CD", quantity: 1500, coupon: 4.300, maturity: "09/30/2027", callStatus: "Call Protected", currentValue: 1500},
      {description: "CAPITAL ONE NATL 4.30000% 09/30/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "14042RUR0", assetClass: "CD", quantity: 500, coupon: 4.300, maturity: "09/30/2027", callStatus: "Call Protected", currentValue: 500},
      {description: "CAPITAL ONE NATL 4.30000% 09/30/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "14042RUR0", assetClass: "CD", quantity: 500, coupon: 4.300, maturity: "09/30/2027", callStatus: "Call Protected", currentValue: 500},
      {description: "CAPITAL ONE NATL 4.30000% 09/30/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "14042RUR0", assetClass: "CD", quantity: 500, coupon: 4.300, maturity: "09/30/2027", callStatus: "Call Protected", currentValue: 500},
      {description: "CAPITAL ONE NATL 4.50000% 10/05/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "14042RUS8", assetClass: "CD", quantity: 500, coupon: 4.500, maturity: "10/05/2027", callStatus: "Call Protected", currentValue: 500},
      {description: "ALLY BANK 4.25000% 10/12/2027", account: "Individual - Z07950813", tag: "HYPO", cusip: "02007GXY4", assetClass: "CD", quantity: 15000, coupon: 4.250, maturity: "10/12/2027", callStatus: "Call Protected", currentValue: 15000, termYears: 1},
  ];

  function parseMaturityDate(value) {
    const parts = value.trim().split("/");
    if (parts.length !== 3) return null;
    const month = Number(parts[0]) - 1;
    const day = Number(parts[1]);
    const year = Number(parts[2]);
    if (!Number.isFinite(month) || !Number.isFinite(day) || !Number.isFinite(year)) return null;
    const date = new Date(year, month, day);
    return Number.isNaN(date.getTime()) ? null : date;
  }

  function formatCurrency(value) {
    return "$" + value.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function formatNumber(value) {
    return value.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function formatYears(value) {
    return value.toFixed(3);
  }

  function getTodayDate() {
    const date = new Date();
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function getPositionStartDate(maturityDate, cusip) {
    const startDate = new Date(maturityDate.getTime());
    const isOneYearRollover = cusip === "38150V3D9" ||
      (cusip === "38150V4M8" && maturityDate.getFullYear() === 2027);
    const yearsBack = isOneYearRollover ? 1 : 2;
    startDate.setFullYear(startDate.getFullYear() - yearsBack);
    return startDate;
  }

  function calculateAccruedInterest(quantity, couponRate, durationYears) {
    if (!Number.isFinite(quantity) || !Number.isFinite(couponRate) || !Number.isFinite(durationYears)) {
      return 0;
    }
    const years = Math.max(0, durationYears);
    const rate = couponRate / 100;
    return quantity * (Math.pow(1 + rate, years) - 1);
  }

  function calculateNext12MonthsInterest(quantity, couponRate, maturityDate, today) {
    if (today >= maturityDate) return 0;
    const oneYearAhead = new Date(today.getTime());
    oneYearAhead.setFullYear(oneYearAhead.getFullYear() + 1);
    const endDate = maturityDate < oneYearAhead ? maturityDate : oneYearAhead;
    const yearsInWindow = Math.max(0, (endDate - today) / MS_PER_DAY / 365.25);
    return quantity * (couponRate / 100) * yearsInWindow;
  }

  function formatRemaining(maturityDate, today) {
    const days = Math.round((maturityDate - today) / MS_PER_DAY);
    if (days <= 0) return "Matured";
    return days + (days === 1 ? " day left" : " days left");
  }

  const ROLLOVER_COUPON_BUMP = 0.24;

  function formatDate(date) {
    const mm = String(date.getMonth() + 1).padStart(2, "0");
    const dd = String(date.getDate()).padStart(2, "0");
    return mm + "/" + dd + "/" + date.getFullYear();
  }

  function formatQuantity(value) {
    return value.toLocaleString("en-US", {maximumFractionDigits: 2});
  }

  // A matured position rolls its principal plus full-term accrued interest into a new
  // 1-year position whose coupon is 0.24 higher.
  function buildRollover(p, maturityDate, accrued) {
    const newMaturity = new Date(maturityDate.getTime());
    newMaturity.setFullYear(newMaturity.getFullYear() + 1);
    const quantity = Math.round((p.quantity + accrued) * 100) / 100;
    const coupon = Math.round((p.coupon + ROLLOVER_COUPON_BUMP) * 1000) / 1000;
    const bank = p.description.replace(/\s+\d+\.\d+%\s+\d\d\/\d\d\/\d{4}$/, "");
    return {
      description: bank + " " + coupon.toFixed(5) + "% " + formatDate(newMaturity),
      account: p.account, tag: p.tag, cusip: "ROLLOVER", assetClass: p.assetClass,
      quantity: quantity, coupon: coupon, maturity: formatDate(newMaturity),
      callStatus: p.callStatus, currentValue: quantity,
      startDate: new Date(maturityDate.getTime()),
      rolledFrom: p.cusip
    };
  }

  function analyze(p, today) {
    const maturityDate = parseMaturityDate(p.maturity);
    if (!maturityDate) return null;
    let startDate = p.startDate;
    if (!startDate && p.termYears) {
      startDate = new Date(maturityDate.getTime());
      startDate.setFullYear(startDate.getFullYear() - p.termYears);
    }
    if (!startDate) startDate = getPositionStartDate(maturityDate, p.cusip);
    const elapsedYears = Math.max(0, (today - startDate) / MS_PER_DAY / 365.25);
    const maxYears = Math.max(0, (maturityDate - startDate) / MS_PER_DAY / 365.25);
    const durationYears = Math.min(elapsedYears, maxYears);
    return {
      maturityDate: maturityDate,
      durationYears: durationYears,
      accrued: calculateAccruedInterest(p.quantity, p.coupon, durationYears),
      next12: calculateNext12MonthsInterest(p.quantity, p.coupon, maturityDate, today),
      remaining: formatRemaining(maturityDate, today)
    };
  }

  function positionCard(p, a, opts) {
    const name = p.description.replace(/\s+\d+\.\d+%\s+\d\d\/\d\d\/\d{4}$/, "");
    const chipClass = a.remaining === "Matured" ? " matured" : (opts.isNew ? " new" : "");
    const chipText = opts.isNew ? "1-yr rollover &middot; " + a.remaining : a.remaining;
    const r = opts.isNew;
    const note = r
      ? '<div class="pos-note">Rolled over from ' + r.cusip + ' (matured ' + r.maturity + '): ' + formatCurrency(r.quantity) +
        ' principal + ' + formatCurrency(r.accrued) + ' accrued interest. Coupon +' + ROLLOVER_COUPON_BUMP.toFixed(2) + '.</div>'
      : '';
    return '<div class="pos-card reveal">' +
        '<div class="pos-head">' +
          '<div>' +
            '<div class="pos-name">' + name + '</div>' +
            '<div class="pos-sub">' + p.assetClass + ' &middot; ' + p.cusip + '</div>' +
            '<span class="pos-chip' + chipClass + '">' + chipText + '</span>' +
          '</div>' +
          '<div class="pos-value">' + formatCurrency(p.currentValue) + '</div>' +
        '</div>' +
        '<div class="pos-grid">' +
          '<div><span class="k">Maturity</span><span class="v">' + p.maturity + '</span></div>' +
          '<div><span class="k">Coupon</span><span class="v">' + p.coupon.toFixed(3) + '%</span></div>' +
          '<div><span class="k">Quantity</span><span class="v">' + formatQuantity(p.quantity) + '</span></div>' +
          '<div><span class="k">Accrued interest</span><span class="v credit">' + formatCurrency(a.accrued) + '</span></div>' +
          '<div><span class="k">Duration</span><span class="v">' + formatYears(a.durationYears) + ' yrs</span></div>' +
          '<div style="grid-column:1/-1;"><span class="k">Call status</span><span class="v">' + p.callStatus + '</span></div>' +
        '</div>' +
        note +
      '</div>';
  }

  function render() {
    const today = getTodayDate();
    let totalPar = 0, totalValue = 0, totalInterest = 0, durationWeighted = 0, activeCount = 0;
    let html = "";

    function addToTotals(p, a) {
      totalPar += p.quantity;
      totalValue += p.currentValue;
      totalInterest += a.next12;
      durationWeighted += a.durationYears * p.quantity;
      activeCount++;
    }

    POSITIONS.forEach(function (p) {
      const a = analyze(p, today);
      if (!a) return;

      if (a.remaining === "Matured") {
        const rolled = buildRollover(p, a.maturityDate, a.accrued);
        const ra = analyze(rolled, today);
        html += positionCard(rolled, ra, {isNew: {cusip: p.cusip, maturity: p.maturity, quantity: p.quantity, accrued: a.accrued}});
        addToTotals(rolled, ra);
      } else {
        html += positionCard(p, a, {});
        addToTotals(p, a);
      }
    });

    document.getElementById("positions-list").innerHTML = html;
    document.getElementById("sum-value").textContent = formatCurrency(totalValue);
    document.getElementById("sum-count").textContent = activeCount;
    document.getElementById("sum-par").textContent = formatNumber(totalPar);
    document.getElementById("sum-interest").textContent = formatCurrency(totalInterest);
    document.getElementById("sum-duration").textContent = formatYears(totalPar > 0 ? durationWeighted / totalPar : 0);
  }

  function scheduleDailyRefresh() {
    const now = new Date();
    const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const delay = Math.max(1000, nextMidnight.getTime() - now.getTime());
    setTimeout(function () {
      render();
      setInterval(render, MS_PER_DAY);
    }, delay);
  }

  render();
  scheduleDailyRefresh();
})();
</script>
</body>
</html>
